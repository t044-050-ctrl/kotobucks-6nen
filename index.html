  <style>
    /* 全体フォントと操作性の最適化（５・６年生向けのさわやかなスカイ・インディゴ基調） */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
      min-height: 100vh;
    }

    /* 賞状タイトル用フォント */
    .font-certificate {
      font-family: 'Kaisei Decol', 'M PLUS Rounded 1c', serif;
    }

    /* 画面切り替えフェードアニメーション */
    .fade-view {
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 正誤フィードバックの拡大ポップアニメーション */
    @keyframes markPop {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }
      55% {
        opacity: 1;
        transform: scale(1.12);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-mark-pop {
      animation: markPop 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 合格証の和風ゴールドフレーム */
    .certificate-frame {
      background: radial-gradient(circle at center, #fffdf7 0%, #fef9e7 100%);
      border: 8px double #d97706;
      box-shadow: inset 0 0 0 4px #fde68a, 0 12px 30px rgba(180, 83, 9, 0.18);
    }

    /* 紙吹雪アニメーション */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(420px) rotate(720deg);
        opacity: 0;
      }
    }

    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: confettiFall linear infinite;
      pointer-events: none;

    .flick-bubble {
      position: absolute;
      z-index: 60;
      pointer-events: none;
      transform: translate(-50%, -115%);
    }

<body class="flex items-center justify-center p-2 sm:p-3 md:p-4">

  <script>
    /* =========================================================================
       1. 効果音エンジン (Tone.js)
       ========================================================================= */
    let isMuted = false;
    let synth = null;

    function initAudio() {
      if (!synth && typeof Tone !== 'undefined') {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.3 }
          }).toDestination();
        } catch (e) {
          console.warn('Audio initialization skipped:', e);
        }
      }
    }

    async function playSound(type) {
      if (isMuted) return;
      try {
        if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
          await Tone.start();
        }
        initAudio();
        if (!synth) return;

        const now = Tone.now();
        if (type === 'tap') {
          synth.triggerAttackRelease('G5', '32n', now);
        } else if (type === 'correct') {
          synth.triggerAttackRelease('E5', '16n', now);
          synth.triggerAttackRelease('G5', '16n', now + 0.09);
          synth.triggerAttackRelease('C6', '8n', now + 0.18);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease('F3', '16n', now);
          synth.triggerAttackRelease('E3', '8n', now + 0.12);
        } else if (type === 'clear') {
          synth.triggerAttackRelease('C5', '16n', now);
          synth.triggerAttackRelease('E5', '16n', now + 0.1);
          synth.triggerAttackRelease('G5', '16n', now + 0.2);
          synth.triggerAttackRelease('C6', '4n', now + 0.3);
        }
      } catch (e) {
        // 音声再生エラーは静かに無視
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const icon = document.getElementById('mute-icon');
      const label = document.getElementById('mute-label');
      if (isMuted) {
        icon.textContent = '🔇';
        label.textContent = 'おと OFF';
      } else {
        icon.textContent = '🔊';
        label.textContent = 'おと ON';
        playSound('tap');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast-box');
      toast.textContent = message;
      toast.classList.remove('hidden', 'opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.classList.add('hidden'), 300);
      }, 2800);
    }

    /* =========================================================================
       3. アプリ状態管理
       ========================================================================= */
    const state = {
      screen: 'home',              // 'home' | 'minna' | 'minna-done' | 'hitori-menu' | 'quiz' | 'stage-result' | 'certificate'
      selectedGrade: 6,            // 5 | 6
      selectedUnitId: '6-jukugo3', // unit.id または 'mix-5' / 'mix-6'
      unitListScrollTop: 0,        // 単元一覧のスクロール位置保持用
      // みんなで学習用（教科書問題10問）
      minnaQueue: [],
      minnaIndex: 0,
      minnaCorrectCount: 0,
      minnaAnswered: false,
      minnaLastCorrect: false,
      minnaSelectedChoice: null,
      // ひとりで挑戦用
      currentStage: 1,             // 1 | 2
      stage1Passed: false,
      stage2Passed: false,
      quizQueue: [],               // 現在の出題リスト
      quizIndex: 0,
      missedList: [],              // 間違えた問題リスト
      isRetryRun: false,
      answeringLocked: false,
      feedbackData: null,          // { isCorrect: boolean, exp: string }
      studentName: ''
    };

    /* =========================================================================
       4. ヘルパー関数（単元取得・問題生成）
       ========================================================================= */
    function getSelectedUnitData() {
      const gradeObj = CURRICULUM[state.selectedGrade];
      if (state.selectedUnitId === `mix-${state.selectedGrade}`) {
        const allMinna = [];
        const allS1 = [];
        const allS2 = [];
        gradeObj.units.forEach(u => {
          allMinna.push(...u.minna.map(q => ({ ...q, unitTitle: u.title })));
          allS1.push(...u.stage1.map(q => ({ ...q, unitTitle: u.title })));
          allS2.push(...u.stage2.map(q => ({ ...q, unitTitle: u.title })));
        });
        return {
          id: `mix-${state.selectedGrade}`,
          pages: '全単元',
          title: `${gradeObj.shortLabel} まとめ総合テスト`,
          subtitle: `${gradeObj.units.length}つの単元からランダムに出題！`,
          isMix: true,
          minna: shuffleArray(allMinna).slice(0, 10),
          stage1: shuffleArray(allS1).slice(0, 10),
          stage2: shuffleArray(allS2).slice(0, 10)
        };
      }
      return gradeObj.units.find(u => u.id === state.selectedUnitId) || gradeObj.units[0];
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateHeader() {
      const btnHome = document.getElementById('btn-home');
      const headerStatus = document.getElementById('header-status');
      const unit = getSelectedUnitData();
      const isG6 = state.selectedGrade === 6;

      if (state.screen === 'home') {
        btnHome.classList.add('hidden');
        btnHome.classList.remove('flex');
        headerStatus.innerHTML = `
          <span class="inline-block px-3 py-1 rounded-full bg-sky-200 text-sky-950 font-bold text-xs sm:text-sm">
            小学５・６年 国語 言葉の学習
          </span>`;
      } else {
        btnHome.className = isG6
          ? 'flex items-center gap-1 px-3 py-1.5 rounded-2xl bg-purple-100 border-2 border-purple-300 text-purple-950 font-bold text-xs sm:text-sm shadow-sm hover:bg-purple-200/70 active:scale-95 transition'
          : 'flex items-center gap-1 px-3 py-1.5 rounded-2xl bg-sky-50 border-2 border-sky-300 text-sky-950 font-bold text-xs sm:text-sm shadow-sm hover:bg-sky-200/70 active:scale-95 transition';
        headerStatus.innerHTML = `
          <span class="inline-block px-3 py-1 rounded-full bg-sky-200 text-sky-950 font-bold text-xs sm:text-sm truncate max-w-[220px] sm:max-w-md">
            ${CURRICULUM[state.selectedGrade].shortLabel}｜${escapeHtml(unit.title)}

    function goHome() {
      playSound('tap');
      state.screen = 'home';
      render();
    }

    /* =========================================================================
       5. 画面描画ルーター
       ========================================================================= */
    function render() {
      updateHeader();
      const root = document.getElementById('screen-root');

      switch (state.screen) {
        case 'home':
          renderHome(root);
          break;
        case 'minna':
          renderMinna(root);
          break;
        case 'minna-done':
          renderMinnaDone(root);
          break;
        case 'hitori-menu':
          renderHitoriMenu(root);
          break;
        case 'quiz':
          renderQuiz(root);
          break;
        case 'stage-result':
          renderStageResult(root);
          break;
        case 'certificate':
          renderCertificate(root);
          break;
      }
    }

                ${escapeHtml(currentUnit.title)}
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

    }

    function selectUnit(unitId) {
      playSound('tap');
      const unitListEl = document.getElementById('unit-list-scroll');
      if (unitListEl) {
        state.unitListScrollTop = unitListEl.scrollTop;
      }
      state.selectedUnitId = unitId;
      render();

    /* -------------------------------------------------------------------------
       画面B: 「みんなで学習」モード（教科書問題 10問・ひとりで挑戦と同じ3択形式）
       ------------------------------------------------------------------------- */
    function startMinna() {
      const unit = getSelectedUnitData();
      if (!unit.minna || unit.minna.length === 0) return;
      playSound('tap');
      state.screen = 'minna';
      state.minnaIndex = 0;
      state.minnaCorrectCount = 0;
      state.minnaAnswered = false;
      state.minnaLastCorrect = false;
      state.minnaSelectedChoice = null;
      // 教科書の流れに沿って順番に出題（選択肢はシャッフル）
      state.minnaQueue = unit.minna.map(q => ({
        ...q,
        _shuffledChoices: shuffleArray(q.c)
      }));
      render();
    }

    function submitMinnaAnswerByIndex(choiceIndex) {
      if (state.minnaAnswered) return;
      const currentQ = state.minnaQueue[state.minnaIndex];
      const selectedChoice = currentQ._shuffledChoices[choiceIndex];
      const isCorrect = selectedChoice === currentQ.a;

      state.minnaAnswered = true;
      state.minnaLastCorrect = isCorrect;
      state.minnaSelectedChoice = selectedChoice;

      if (isCorrect) {
        state.minnaCorrectCount++;
        playSound('correct');
      } else {
        playSound('wrong');
      }
      render();
    }

    function nextMinnaQuestion() {
      playSound('tap');
      state.minnaAnswered = false;
      state.minnaLastCorrect = false;
      state.minnaSelectedChoice = null;

      if (state.minnaIndex + 1 < state.minnaQueue.length) {
        state.minnaIndex++;
        render();
      } else {
        playSound('clear');
        state.screen = 'minna-done';
        render();
      }
    }

    /* -------------------------------------------------------------------------
       画面D: 「ひとりで挑戦」ステージ選択画面
       ------------------------------------------------------------------------- */
    function openHitoriMenu() {
      playSound('tap');
      state.screen = 'hitori-menu';
      state.stage1Passed = false;
      state.stage2Passed = false;
      render();
    }

    function startQuizStage(stageNum, retryQuestions = null) {
      playSound('tap');
      const unit = getSelectedUnitData();
      state.currentStage = stageNum;
      state.screen = 'quiz';
      state.quizIndex = 0;
      state.missedList = [];
      state.answeringLocked = false;
      state.feedbackData = null;

      if (retryQuestions && retryQuestions.length > 0) {
        state.isRetryRun = true;
        state.quizQueue = shuffleArray(retryQuestions).map(q => ({
          ...q,
          _shuffledChoices: shuffleArray(q.c)
        }));
      } else {
        state.isRetryRun = false;
        const source = stageNum === 1 ? unit.stage1 : unit.stage2;
        state.quizQueue = shuffleArray(source).map(q => ({
          ...q,
          _shuffledChoices: shuffleArray(q.c)
        }));
      }
      render();
    }

    function renderHitoriMenu(root) {
      const unit = getSelectedUnitData();
      const isG6 = state.selectedGrade === 6;

      root.innerHTML = `
        <div class="fade-view flex flex-col items-center justify-center text-center my-auto gap-5">

            <span class="inline-block px-3 py-1 rounded-full bg-sky-200 text-sky-950 font-extrabold text-xs sm:text-sm mb-2">

            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">${escapeHtml(unit.title)}</h2>

            <button type="button" onclick="startQuizStage(1)"
              class="p-5 rounded-3xl bg-sky-200 hover:bg-sky-300 text-sky-950 border-b-4 border-sky-400 font-extrabold shadow-lg transition transform hover:scale-105 active:scale-95 flex flex-col items-center gap-1.5">
              <span class="text-xs bg-white/70 text-sky-950 px-3 py-0.5 rounded-full">基本編（全${unit.stage1.length}問）</span>
              <span class="text-2xl">ステージ １</span>
              <span class="text-xs font-bold">${state.stage1Passed ? '✅ クリアずみ！' : 'まずはここからスタート！'}</span>

              <span class="text-xs font-bold">${state.stage2Passed ? '✅ クリアずみ！' : 'レベルアップ問題に挑戦！'}</span>

          <button type="button" onclick="goHome()"

    /* -------------------------------------------------------------------------
       画面E: 「ひとりで挑戦」クイズ出題・正誤判定画面
       ------------------------------------------------------------------------- */
    function renderQuiz(root) {
      const currentQ = state.quizQueue[state.quizIndex];
      const total = state.quizQueue.length;
      const isG6 = state.selectedGrade === 6;

      if (!currentQ._shuffledChoices) {
        currentQ._shuffledChoices = shuffleArray(currentQ.c);
      }

      root.innerHTML = `
        <div class="fade-view flex flex-col justify-between flex-1 gap-4 relative">
          <!-- 上部ステータス -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full font-extrabold text-xs sm:text-sm ${
                state.currentStage === 1 ? 'bg-amber-300 text-amber-950' : 'bg-indigo-600 text-white'
              }">
                ステージ ${state.currentStage} ${state.isRetryRun ? '（やりなおし）' : ''}
              </span>
              ${currentQ.unitTitle ? `<span class="text-xs font-bold text-sky-800">[${escapeHtml(currentQ.unitTitle)}]</span>` : ''}
            </div>

            <div class="flex items-center gap-2">
              <span class="px-3.5 py-1 rounded-full bg-sky-100 border-2 border-sky-300 text-sky-950 font-extrabold text-sm">
                もんだい ${state.quizIndex + 1} / ${total}
              </span>
              <button type="button" onclick="openHitoriMenu()"
                class="px-3 py-1 rounded-xl ${
                  isG6
                    ? 'bg-purple-100 hover:bg-purple-200 text-purple-950'
                    : 'bg-slate-200 hover:bg-slate-300 text-slate-800'
                } font-bold text-xs">
                やめる
              </button>
            </div>
          </div>

          <!-- 問題文ボックス -->
          <div class="my-auto p-5 sm:p-7 rounded-3xl bg-sky-50 border-4 border-sky-300 shadow-inner text-center relative">
            <p class="text-lg sm:text-2xl font-extrabold text-slate-800 leading-relaxed whitespace-pre-line">
              ${formatQuestionHtml(currentQ.q)}
            </p>

            <!-- 正誤オーバーレイ（大きな ○ / × ） -->
            ${state.feedbackData ? `
              <div class="absolute inset-0 flex items-center justify-center bg-white/85 rounded-2xl pointer-events-none">
                <div class="animate-mark-pop text-8xl sm:text-9xl font-extrabold ${
                  state.feedbackData.isCorrect ? 'text-sky-500' : 'text-rose-500'
                }">
                  ${state.feedbackData.isCorrect ? '○' : '×'}
                </div>
              </div>
            ` : ''}
          </div>

          <!-- 解説メッセージ（回答後に表示） -->
          <div class="min-h-[54px] flex items-center justify-center">
            ${state.feedbackData ? `
              <div class="w-full p-3 rounded-2xl border-2 font-bold text-xs sm:text-sm text-center fade-view ${
                state.feedbackData.isCorrect
                  ? 'bg-sky-100 border-sky-500 text-sky-950'
                  : 'bg-rose-100 border-rose-400 text-rose-950'
              }">
                <span class="font-extrabold mr-1">${state.feedbackData.isCorrect ? 'せいかい！' : `ざんねん！正解は「${escapeHtml(currentQ.a)}」`}</span>
                <span>${escapeHtml(state.feedbackData.exp)}</span>
              </div>
            ` : `
              <p class="text-xs sm:text-sm font-bold text-sky-900">下から正しいものを １つえらぼう！</p>
            `}
          </div>

          <!-- 選択肢ボタン -->
          <div class="grid grid-cols-1 gap-3">
            ${currentQ._shuffledChoices.map((choice, cIdx) => {
              let btnStyle = isG6
                ? 'bg-purple-50/80 hover:bg-purple-100 border-purple-300 text-slate-800'
                : 'bg-white hover:bg-sky-50 border-sky-300 text-slate-800';
              if (state.feedbackData) {
                if (choice === currentQ.a) {
                  btnStyle = isG6
                    ? 'bg-purple-300 border-purple-500 text-purple-950'
                    : 'bg-sky-500 border-sky-700 text-white';
                } else {
                  btnStyle = 'bg-slate-100 border-slate-200 text-slate-400';
                }
              }
              return `
                <button type="button" onclick="submitAnswerByIndex(${cIdx})"
                  ${state.answeringLocked ? 'disabled' : ''}
                  class="w-full py-3.5 sm:py-4 px-5 rounded-2xl border-4 font-extrabold text-base sm:text-xl shadow-md transition transform active:scale-95 ${btnStyle}">
                  ${state.selectedUnitId === '5-wago-kango' ? formatQuestionHtml(choice) : escapeHtml(choice)}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function submitAnswerByIndex(choiceIndex) {
      if (state.answeringLocked) return;
      const currentQ = state.quizQueue[state.quizIndex];
      const selectedChoice = currentQ._shuffledChoices[choiceIndex];
      submitAnswer(selectedChoice);
    }

    function submitAnswer(selectedChoice) {
      if (state.answeringLocked) return;
      state.answeringLocked = true;

      const currentQ = state.quizQueue[state.quizIndex];
      const isCorrect = selectedChoice === currentQ.a;

      if (isCorrect) {
        playSound('correct');
      } else {
        playSound('wrong');
        state.missedList.push(currentQ);
      }

      state.feedbackData = {
        isCorrect,
        exp: currentQ.exp
      };
      render();

      // 解説を読む時間を確保してから自動で次へ進む
      setTimeout(() => {
        state.feedbackData = null;
        state.answeringLocked = false;
        if (state.quizIndex + 1 < state.quizQueue.length) {
          state.quizIndex++;
          render();
        } else {
          finishStage();
        }
      }, isCorrect ? 1300 : 2100);
    }

    function finishStage() {
      if (state.missedList.length === 0) {
        if (state.currentStage === 1) state.stage1Passed = true;
        if (state.currentStage === 2) state.stage2Passed = true;
        playSound('clear');

        // ステージ1・2ともにクリアしたら合格証へ自動遷移！
        if (state.stage1Passed && state.stage2Passed) {
          state.screen = 'certificate';
          render();
          return;
        }
      }
      state.screen = 'stage-result';
      render();
    }

              </p>
              <p class="text-sm font-bold text-slate-600 mt-1">

              </p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md">
              <button type="button" onclick="startQuizStage(${state.currentStage === 1 ? 2 : 1})"
                class="flex-1 py-4 px-6 rounded-2xl ${
                  isG6
                    ? 'bg-purple-300 hover:bg-purple-400 text-purple-950 border-b-4 border-purple-500'
                    : 'bg-indigo-600 hover:bg-indigo-700 text-white border-b-4 border-indigo-800'
                } font-extrabold text-lg shadow-lg transition transform hover:scale-105 active:scale-95">
                ステージ ${state.currentStage === 1 ? '２' : '１'} にすすむ ▶
              </button>
            </div>
          ` : `
            <div>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-rose-600 mb-2">
                おしい！ ${missCount}問 間違えたよ
              </h2>
              <p class="text-sm sm:text-base font-bold text-slate-700">
                間違えた問題だけ もう一度 挑戦しよう！
              </p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-lg">
              <button type="button" onclick="retryMissedQuestions()"
                class="flex-1 py-4 px-5 rounded-2xl ${
                  isG6
                    ? 'bg-purple-300 hover:bg-purple-400 text-purple-950 border-b-4 border-purple-500'
                    : 'bg-orange-500 hover:bg-orange-600 text-white border-b-4 border-orange-700'
                } font-extrabold text-base sm:text-lg shadow-lg transition transform hover:scale-105 active:scale-95">
                🔥 間違えた問題を<br />もう一度！
              </button>
              <button type="button" onclick="openHitoriMenu()"
                class="py-4 px-5 rounded-2xl ${
                  isG6
                    ? 'bg-purple-100 hover:bg-purple-200 text-purple-950'
                    : 'bg-slate-200 hover:bg-slate-300 text-slate-800'
                } font-bold text-sm sm:text-base transition">
                ステージをえらぶ
              </button>
            </div>
          `}
        </div>
      `;
    }

    function retryMissedQuestions() {
      const toRetry = [...state.missedList];
      startQuizStage(state.currentStage, toRetry);
    }

    /* -------------------------------------------------------------------------
       画面G: 合格証（賞状・リアルタイム日時・画像ダウンロード）
       ------------------------------------------------------------------------- */
    function getFormattedNow() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}年${m}月${d}日 ${hh}:${mm}`;
    }

    function renderCertificate(root) {
      const unit = getSelectedUnitData();
      const gradeLabel = CURRICULUM[state.selectedGrade].shortLabel;
      const dateStr = getFormattedNow();
      const isG6 = state.selectedGrade === 6;

      // 紙吹雪の生成
      const colors = ['#f59e0b', '#38bdf8', '#f43f5e', '#10b981', '#6366f1'];
      const confettiHtml = Array.from({ length: 24 }).map((_, i) => {
        const left = (i * 4.2) % 98;
        const delay = (i * 0.18) % 2.5;
        const dur = 2.6 + (i % 4) * 0.45;
        const color = colors[i % colors.length];
        return `<span class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s;"></span>`;
      }).join('');

      root.innerHTML = `
        <div class="fade-view flex flex-col items-center justify-between flex-1 gap-4 relative overflow-hidden">
          ${confettiHtml}

          <!-- キャプチャ対象の賞状カード -->
          <div id="certificate-capture" class="certificate-frame w-full max-w-2xl rounded-3xl p-5 sm:p-8 text-center relative my-auto">
            <div class="text-amber-600 font-extrabold text-xs sm:text-sm tracking-widest mb-1">
              ★ 言葉の力 マスター認定 ★
            </div>
            <h2 class="font-certificate text-3xl sm:text-5xl font-bold text-amber-800 tracking-widest mb-4">
              合 格 証
            </h2>

            <!-- 児童名入力（タップでスマホ風文字パネル表示） -->
            <div class="mb-4 flex items-center justify-center gap-2">
              <button id="cert-name-btn" type="button" onclick="openNameKeyboard()"
                class="text-center font-extrabold text-lg sm:text-2xl ${
                  isG6 ? 'bg-purple-50 hover:bg-purple-100 border-purple-400' : 'bg-white/90 hover:bg-white border-amber-500'
                } border-b-4 px-4 py-1.5 rounded-t-xl shadow-sm transition active:scale-95 min-w-[230px] sm:min-w-[300px] ${
                  state.studentName ? 'text-slate-800' : (isG6 ? 'text-purple-800' : 'text-amber-700')
                }">
                ${state.studentName ? escapeHtml(state.studentName) : 'なまえ（タップして入力）'}
              </button>
              <span class="font-extrabold text-lg sm:text-xl text-slate-800">さん</span>
            </div>

            <p class="text-sm sm:text-lg font-bold text-slate-800 leading-relaxed mb-4">
              あなたは、<br />
              <span class="text-indigo-700 font-extrabold text-base sm:text-xl">
                ${gradeLabel}「${escapeHtml(unit.title)}」
              </span><br />
              の すべてのステージに 合格しました。<br />
              その 努力と 言葉の力を ここに しょうめいします！
            </p>

            <div class="flex items-center justify-between pt-3 border-t-2 border-amber-300/80 text-xs sm:text-sm font-bold text-amber-900">
              <span>達成日時：${dateStr}</span>
              <span class="px-3 py-1 rounded-full bg-rose-500 text-white font-extrabold shadow-sm">
                💮 たいへんよくできました
              </span>
            </div>
          </div>

          <!-- 下部アクションボタン（もどる・しゃしんで保存） -->
          <div class="flex flex-wrap items-center justify-center gap-3 z-10">
            <button type="button" onclick="goHome()"
              class="py-3 px-6 rounded-2xl ${
                isG6
                  ? 'bg-purple-100 hover:bg-purple-200 text-purple-950'
                  : 'bg-slate-200 hover:bg-slate-300 text-slate-800'
              } font-extrabold text-base shadow transition active:scale-95">
              ◀ もどる
            </button>
            <button type="button" onclick="downloadCertificate()"
              class="py-3 px-6 rounded-2xl ${
                isG6
                  ? 'bg-purple-300 hover:bg-purple-400 text-purple-950 border-b-4 border-purple-500'
                  : 'bg-emerald-500 hover:bg-emerald-600 text-white border-b-4 border-emerald-700'
              } font-extrabold text-base shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
              <span>📷</span>
              <span>写真で保存する</span>
            </button>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatQuestionHtml(str) {
      return escapeHtml(str).replace(
        /＿+/g,
        '<span class="inline-block w-14 sm:w-20 border-b-[3px] border-slate-800 mx-1 leading-none">&nbsp;</span>'
      );
    }

    /* =========================================================================
       6. スマホ風日本語文字入力パネル（トグル・フリック・漢字変換対応）
       ========================================================================= */
    const KANA_KEYS = [
      { id: 'a', label: 'あ', flick: { center: 'あ', left: 'い', up: 'う', right: 'え', down: 'お' }, toggle: ['あ', 'い', 'う', 'え', 'お', 'ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ'] },
      { id: 'ka', label: 'か', flick: { center: 'か', left: 'き', up: 'く', right: 'け', down: 'こ' }, toggle: ['か', 'き', 'く', 'け', 'こ'] },
      { id: 'sa', label: 'さ', flick: { center: 'さ', left: 'し', up: 'す', right: 'せ', down: 'そ' }, toggle: ['さ', 'し', 'す', 'せ', 'そ'] },
      { id: 'ta', label: 'た', flick: { center: 'た', left: 'ち', up: 'つ', right: 'て', down: 'と' }, toggle: ['た', 'ち', 'つ', 'て', 'と', 'っ'] },
      { id: 'na', label: 'な', flick: { center: 'な', left: 'に', up: 'ぬ', right: 'ね', down: 'の' }, toggle: ['な', 'に', 'ぬ', 'ね', 'の'] },
      { id: 'ha', label: 'は', flick: { center: 'は', left: 'ひ', up: 'ふ', right: 'へ', down: 'ほ' }, toggle: ['は', 'ひ', 'ふ', 'へ', 'ほ'] },

    // 教育漢字1,026字と名乗り読みを含む統合辞書を構築（教育漢字以外はすべて除外）
    const KANJI_DICT = (() => {
      const merged = {};
      const pushWord = (reading, word) => {
        if (!reading || !word || !isEduKanjiOnly(word)) return;
        if (!merged[reading]) merged[reading] = [];
        if (!merged[reading].includes(word)) {
          merged[reading].push(word);
        }
      };

      // 1. 熟語・氏名辞書から教育漢字のみの候補を登録
      Object.entries(RAW_KANJI_DICT).forEach(([reading, words]) => {
        words.forEach(w => pushWord(reading, w));
      });

      // 2. 教育漢字の単漢字読み（音読み・訓読み・名乗り読み）を登録（「一」の複数読み等）
      Object.entries(EDU_SINGLE_READINGS).forEach(([kanji, readings]) => {
        if (!EDU_KANJI_SET.has(kanji)) return;
        readings.forEach(r => pushWord(r, kanji));
      });

      return merged;
    })();

    const kbState = {
      committed: '',     // 確定済み文字列
      composing: '',     // 未確定のひらがな文字列
      lastKeyId: null,   // 直前にトグル入力したキーID
      toggleIndex: 0,    // トグル循環インデックス
      canToggleLast: false, // 直前の文字がトグルで入れ替え可能か
      currentCandidates: [] // 現在の変換候補配列
    };

    function openNameKeyboard() {
      playSound('tap');
      kbState.committed = state.studentName || '';
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.toggleIndex = 0;
      kbState.canToggleLast = false;

      const modal = document.getElementById('kana-keyboard-modal');
      modal.classList.remove('hidden');
      buildKeyboardModal();
    }

    function closeNameKeyboard(applyText) {
      playSound('tap');
      if (applyText) {
        state.studentName = (kbState.committed + kbState.composing).trim();
        const certBtn = document.getElementById('cert-name-btn');
        if (certBtn) {
          certBtn.textContent = state.studentName ? state.studentName : 'なまえ（タップして入力）';
          certBtn.classList.toggle('text-slate-800', Boolean(state.studentName));
          certBtn.classList.toggle('text-amber-700', !state.studentName);
        }
      }
      const modal = document.getElementById('kana-keyboard-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
    }

    function getConversionCandidates(composing) {
      if (!composing) return [];
      const results = [];
      const seen = new Set();

      const addCandidate = (word, consumeLen) => {
        if (!word || seen.has(word)) return;
        seen.add(word);
        results.push({ word, consumeLen });
      };

      // 長い一致から順に漢字辞書を検索
      for (let len = composing.length; len >= 1; len--) {
        const prefix = composing.slice(0, len);
        const matches = KANJI_DICT[prefix];
        if (matches) {
          matches.forEach(word => addCandidate(word, len));
        }
      }

      // ひらがなそのまま・カタカナ変換も候補に追加
      addCandidate(composing, composing.length);
      const katakana = composing.replace(/[\u3041-\u3096]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) + 0x60)
      );
      if (katakana !== composing) {
        addCandidate(katakana, composing.length);
      }

      return results;
    }

    function applyCandidateByIndex(idx) {
      const cand = kbState.currentCandidates[idx];
      if (!cand) return;
      playSound('tap');
      kbState.committed += cand.word;
      kbState.composing = kbState.composing.slice(cand.consumeLen);
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    // フリックまたはトグルで1文字入力する処理
    function inputKanaChar(keyObj, mode, flickDir = 'center') {
      playSound('tap');

      if (keyObj.isModifier) {
        // 濁点・半濁点・小文字の変換
        if (kbState.composing.length > 0) {
          const lastChar = kbState.composing.slice(-1);
          if (CHAR_CYCLE_MAP[lastChar]) {
            kbState.composing = kbState.composing.slice(0, -1) + CHAR_CYCLE_MAP[lastChar];
          }
        } else if (kbState.committed.length > 0) {
          const lastChar = kbState.committed.slice(-1);
          if (CHAR_CYCLE_MAP[lastChar]) {
            kbState.committed = kbState.committed.slice(0, -1) + CHAR_CYCLE_MAP[lastChar];
          }
        }
        kbState.lastKeyId = null;
        kbState.canToggleLast = false;
        updateKeyboardDisplay();
        return;
      }

      if (mode === 'flick') {
        const ch = keyObj.flick[flickDir] || keyObj.flick.center;
        if (ch === '　') {
          kbState.committed += kbState.composing + '　';
          kbState.composing = '';
        } else {
          kbState.composing += ch;
        }
        kbState.lastKeyId = null;
        kbState.canToggleLast = false;
      } else {
        // トグル入力
        if (kbState.canToggleLast && kbState.lastKeyId === keyObj.id && kbState.composing.length > 0) {
          kbState.toggleIndex = (kbState.toggleIndex + 1) % keyObj.toggle.length;
          const nextChar = keyObj.toggle[kbState.toggleIndex];
          kbState.composing = kbState.composing.slice(0, -1) + nextChar;
        } else {
          kbState.toggleIndex = 0;
          const firstChar = keyObj.toggle[0];
          if (firstChar === '　') {
            kbState.committed += kbState.composing + '　';
            kbState.composing = '';
            kbState.lastKeyId = null;
            kbState.canToggleLast = false;
          } else {
            kbState.composing += firstChar;
            kbState.lastKeyId = keyObj.id;
            kbState.canToggleLast = true;
          }
        }
      }

      updateKeyboardDisplay();
    }

    function advanceKanaCursor() {
      playSound('tap');
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function backspaceKana() {
      playSound('tap');
      if (kbState.composing.length > 0) {
        kbState.composing = kbState.composing.slice(0, -1);
      } else if (kbState.committed.length > 0) {
        kbState.committed = kbState.committed.slice(0, -1);
      }
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function clearKanaAll() {
      playSound('tap');
      kbState.committed = '';
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    function commitComposingText() {
      playSound('tap');
      kbState.committed += kbState.composing;
      kbState.composing = '';
      kbState.lastKeyId = null;
      kbState.canToggleLast = false;
      updateKeyboardDisplay();
    }

    // 入力文字列と変換候補バーのみをピンポイントで更新する（パネル全体のちらつき防止）
    function updateKeyboardDisplay() {
      const textDisplay = document.getElementById('kb-text-display');
      const candidatesBar = document.getElementById('kb-candidates-bar');
      if (!textDisplay || !candidatesBar) return;

      kbState.currentCandidates = getConversionCandidates(kbState.composing);

      textDisplay.innerHTML = `
        <span>${escapeHtml(kbState.committed)}</span><span class="underline decoration-sky-500 decoration-4 bg-sky-100 text-sky-950 px-0.5 rounded">${escapeHtml(kbState.composing)}</span><span class="inline-block w-0.5 h-6 bg-sky-600 animate-pulse align-middle ml-0.5"></span>
        ${(!kbState.committed && !kbState.composing) ? '<span class="text-slate-400 text-base font-bold">下のパネルで入力してね</span>' : ''}
      `;

      candidatesBar.innerHTML = kbState.currentCandidates.length > 0
        ? kbState.currentCandidates.map((c, idx) => `
            <button type="button" onclick="applyCandidateByIndex(${idx})"
              class="shrink-0 px-3.5 py-1.5 rounded-xl bg-white hover:bg-sky-100 border-2 border-sky-400 text-slate-900 font-extrabold text-base sm:text-lg shadow-sm active:scale-95 transition">
              ${escapeHtml(c.word)}
            </button>
          `).join('')
        : `<span class="text-xs font-bold text-sky-900/80 px-2">ひらがなを入力すると ここに漢字の候補が出ます（タップ＝トグル／スライド＝フリック）</span>`;
      candidatesBar.scrollLeft = 0;
    }

    // タップ（トグル入力）とドラッグ（フリック入力）の両方を判定するイベント設定
    function attachFlickAndToggleListeners() {
      const keyButtons = document.querySelectorAll('.kana-pad-key');
      const guideEl = document.getElementById('flick-guide-overlay');

      keyButtons.forEach(btn => {
        const keyId = btn.getAttribute('data-key-id');
        const keyObj = KANA_KEYS.find(k => k.id === keyId);
        if (!keyObj) return;

        let startX = 0;
        let startY = 0;
        let activePointerId = null;
        let currentDir = 'center';
        let isFlickMoved = false;

        const updateFlickGuide = (dir) => {
          if (!keyObj.flick || !guideEl) return;
          const rect = btn.getBoundingClientRect();
          const modalRect = btn.closest('.fade-view').getBoundingClientRect();
          guideEl.style.left = `${rect.left - modalRect.left + rect.width / 2}px`;
          guideEl.style.top = `${rect.top - modalRect.top}px`;

          const f = keyObj.flick;
          guideEl.innerHTML = `
            <div class="grid grid-cols-3 gap-1 text-xs sm:text-sm font-extrabold leading-none">
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'up' ? 'bg-amber-300 text-slate-950 scale-110' : 'opacity-75'}">${f.up}</span>
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'left' ? 'bg-amber-300 text-slate-950 scale-110' : 'opacity-75'}">${f.left}</span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'center' ? 'bg-amber-300 text-slate-950 scale-110' : 'opacity-75'}">${f.center}</span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'right' ? 'bg-amber-300 text-slate-950 scale-110' : 'opacity-75'}">${f.right}</span>
              <span></span>
              <span class="px-1.5 py-0.5 rounded ${dir === 'down' ? 'bg-amber-300 text-slate-950 scale-110' : 'opacity-75'}">${f.down}</span>
              <span></span>
            </div>
          `;
          guideEl.classList.remove('hidden');
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          activePointerId = e.pointerId;
          btn.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;
          currentDir = 'center';
          isFlickMoved = false;
          if (keyObj.flick) {
            updateFlickGuide('center');
          }
        });

        btn.addEventListener('pointermove', (e) => {
          if (e.pointerId !== activePointerId || !keyObj.flick) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const dist = Math.hypot(dx, dy);

          if (dist >= 22) {
            isFlickMoved = true;
            if (Math.abs(dx) > Math.abs(dy)) {
              currentDir = dx < 0 ? 'left' : 'right';
            } else {
              currentDir = dy < 0 ? 'up' : 'down';
            }
          } else {
            currentDir = 'center';
          }
          updateFlickGuide(currentDir);
        });

        const endPointer = (e) => {
          if (e.pointerId !== activePointerId) return;
          activePointerId = null;
          if (guideEl) guideEl.classList.add('hidden');

          if (keyObj.isModifier) {
            inputKanaChar(keyObj, 'toggle');
          } else if (isFlickMoved) {
            inputKanaChar(keyObj, 'flick', currentDir);
          } else {
            inputKanaChar(keyObj, 'toggle');
          }
        };

        btn.addEventListener('pointerup', endPointer);
        btn.addEventListener('pointercancel', () => {
          activePointerId = null;
          if (guideEl) guideEl.classList.add('hidden');
        });
      });
    }

    async function downloadCertificate() {
      playSound('tap');
      const target = document.getElementById('certificate-capture');
      if (!target || typeof html2canvas === 'undefined') {
        showToast('スクリーンショット機能で画面を保存してね！');
        return;
      }
      try {
        showToast('合格証の画像を作成しています...');
        const canvas = await html2canvas(target, {
          scale: 2,
          backgroundColor: '#fffdf7',
          useCORS: true
        });
        const link = document.createElement('a');
        link.download = `kokugo_gokakusho_${state.selectedGrade}nen.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('合格証をダウンロードしました！');
      } catch (err) {
        console.warn('Screenshot failed:', err);
        showToast('保存できないときは、スクリーンショットを使ってね！');
      }
    }

    // 長押し・右クリック・ダブルタップによるコンテキストメニューや選択を防止
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('selectstart', (e) => {
      e.preventDefault();
    });

    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
    });

    document.addEventListener('dblclick', (e) => {
      e.preventDefault();
    }, { passive: false });

    // 初期描画
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
